name: Production shadow watchdog

on:
  schedule:
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-shadow-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: Monitor read-only BTC DCA shadow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: btc_dca_bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Collect bounded GitHub evidence
        uses: actions/github-script@v8
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'production-shadow.yml', per_page: 20
            });
            require('fs').writeFileSync('/tmp/production-shadow-evidence.json', JSON.stringify({
              observed_at: new Date().toISOString(), shadow_runs: response.data.workflow_runs
            }), 'utf8');
      - name: Evaluate canonical scheduler health
        id: monitor
        run: >-
          uv run python -m btc_dca_bridge.monitoring.shadow_health
          --evidence /tmp/production-shadow-evidence.json
          --github-output "$GITHUB_OUTPUT"
      - name: Send Telegram alert
        if: steps.monitor.outputs.scheduler_health_status != 'HEALTHY'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_EXECUTION_STATUS: ${{ steps.monitor.outputs.monitor_execution_status }}
          SYSTEM_HEALTH_STATUS: ${{ steps.monitor.outputs.system_health_status }}
          SCHEDULER_HEALTH_STATUS: ${{ steps.monitor.outputs.scheduler_health_status }}
          OBSERVED_RUN_ID: ${{ steps.monitor.outputs.run_id }}
          WATCHDOG_REASON: ${{ steps.monitor.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token, chat_id = os.environ["TELEGRAM_BOT_TOKEN"], os.environ["TELEGRAM_CHAT_ID"]
          message = "\n".join((
              "BTC DCA SHADOW WATCHDOG",
              f"monitor execution: {os.environ['MONITOR_EXECUTION_STATUS']}",
              f"system health: {os.environ['SYSTEM_HEALTH_STATUS']}",
              f"scheduler health: {os.environ['SCHEDULER_HEALTH_STATUS']}",
              f"observed run ID: {os.environ['OBSERVED_RUN_ID']}",
              f"reason: {os.environ['WATCHDOG_REASON']}",
              "NO ORDER EXECUTED", "Authorization: NOT_AUTHORIZED"))
          request = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=json.dumps({"chat_id": chat_id, "text": message}).encode(), headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=10) as response:
              if response.status != 200 or not json.loads(response.read().decode()).get("ok"):
                  raise SystemExit("Telegram API rejected the alert.")
          PY
      - name: Write watchdog summary
        if: always()
        run: |
          {
            echo "## Production shadow watchdog"
            echo "- monitor execution: ${{ steps.monitor.outputs.monitor_execution_status }}"
            echo "- system health: ${{ steps.monitor.outputs.system_health_status }}"
            echo "- scheduler health: ${{ steps.monitor.outputs.scheduler_health_status }}"
            echo "- observed run ID: ${{ steps.monitor.outputs.run_id }}"
            echo "- read-only: yes"
          } >> "$GITHUB_STEP_SUMMARY"
