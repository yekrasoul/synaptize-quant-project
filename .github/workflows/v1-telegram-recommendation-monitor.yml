name: V1 Telegram recommendation monitor

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v1-telegram-recommendation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Read-only V1 recommendation monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: btc_dca_bridge
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check out canonical repository
        uses: actions/checkout@v5

      - name: Initialize monitor runtime paths
        shell: bash
        run: |
          set -euo pipefail
          echo "V1_MONITOR_DIR=${RUNNER_TEMP}/v1-recommendation-monitor" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Verify Telegram secrets are wired
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Required Telegram repository secrets are unavailable." >&2
            exit 1
          fi

      - name: Locate previous V1 monitor state
        id: prior
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const candidates = artifacts
              .filter(a => a.name === 'v1-recommendation-monitor-state' && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const match = candidates[0];
            core.setOutput('artifact_id', match ? String(match.id) : '');
            core.setOutput('run_id', match ? String(match.workflow_run.id) : '');

      - name: Restore previous V1 monitor state
        if: steps.prior.outputs.artifact_id != ''
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ steps.prior.outputs.artifact_id }}
          path: ${{ env.V1_MONITOR_DIR }}/previous
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.prior.outputs.run_id }}

      - name: Evaluate V1 recommendation using Bybit Spot only
        id: evaluate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$V1_MONITOR_DIR/current"
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          from btc_dca_bridge.config import load_market_data_config, load_sentiment_config, load_strategy_config
          from btc_dca_bridge.engine import calculate_decision
          from btc_dca_bridge.ledger import read_executions
          from btc_dca_bridge.market_data.bybit import BybitSpotAdapter
          from btc_dca_bridge.market_data.http import PublicHttpTransport
          from btc_dca_bridge.market_data.provider import BybitSnapshotSource
          from btc_dca_bridge.paths import LEDGER_PATH
          from btc_dca_bridge.portfolio import derive_portfolio
          from btc_dca_bridge.sentiment import AlternativeMeFearGreedAdapter

          root = Path(os.environ["V1_MONITOR_DIR"])
          previous_candidates = sorted((root / "previous").glob("**/state.json"))
          previous = json.loads(previous_candidates[-1].read_text(encoding="utf-8")) if previous_candidates else None

          now = datetime.now(UTC)
          today = now.strftime("%Y-%m-%d")
          observed = now.isoformat().replace("+00:00", "Z")
          state = {"schema_version": "1.0.0", "observed_at_utc": observed, "date_utc": today}

          try:
              market_config = load_market_data_config()
              sentiment_config = load_sentiment_config()
              strategy = load_strategy_config()
              clock = lambda: now

              market_transport = PublicHttpTransport(
                  "https://api.bybit.com",
                  connect_timeout_seconds=market_config.http.connect_timeout_seconds,
                  read_timeout_seconds=market_config.http.read_timeout_seconds,
                  max_attempts=market_config.http.retry_attempts,
                  backoff_seconds=market_config.http.backoff_seconds,
              )
              market = BybitSnapshotSource(
                  BybitSpotAdapter(
                      transport=market_transport,
                      clock=clock,
                      page_limit=market_config.candle_page_limit,
                      max_pages=market_config.candle_max_pages,
                  ),
                  clock=clock,
                  max_input_age=timedelta(seconds=market_config.freshness_max_age_seconds),
              ).get_market_snapshot(captured_at_utc=now)

              sentiment_transport = PublicHttpTransport(
                  "https://api.alternative.me",
                  connect_timeout_seconds=sentiment_config.http.connect_timeout_seconds,
                  read_timeout_seconds=sentiment_config.http.read_timeout_seconds,
                  max_attempts=sentiment_config.http.retry_attempts,
                  backoff_seconds=sentiment_config.http.backoff_seconds,
              )
              sentiment = AlternativeMeFearGreedAdapter(
                  transport=sentiment_transport,
                  clock=clock,
                  max_observation_age=timedelta(seconds=sentiment_config.freshness_max_age_seconds),
              ).fetch_current()

              executions = read_executions(LEDGER_PATH)
              portfolio = derive_portfolio(executions, now.strftime("%Y-%m"), strategy.monthly_cap_usd)
              decision = calculate_decision(
                  market,
                  sentiment.value,
                  portfolio.monthly_confirmed_usd_deployed,
                  strategy,
              ).to_dict()

              full = {
                  "status": "OK",
                  "market_source": market.source,
                  "btc_price_usdt": str(market.current_price_usdt),
                  "rolling_7d_high_usdt": str(market.rolling_7d_high_usdt),
                  "drawdown_percent": str(decision["drawdown_percent"]),
                  "fear_greed": sentiment.value,
                  "base_allocation_usd": str(decision["base_allocation_usd"]),
                  "sentiment_multiplier": str(decision["sentiment_multiplier"]),
                  "calculated_allocation_usd": str(decision["calculated_allocation_usd"]),
                  "monthly_spent_usd": str(decision["monthly_spent_before_usd"]),
                  "remaining_budget_usd": str(decision["remaining_budget_before_usd"]),
                  "final_purchase_usd": str(decision["final_purchase_usd"]),
                  "ledger_execution_count": len(executions),
              }
              state.update(full)
              material = {
                  "date_utc": today,
                  "status": "OK",
                  "market_source": full["market_source"],
                  "base_allocation_usd": full["base_allocation_usd"],
                  "sentiment_multiplier": full["sentiment_multiplier"],
                  "calculated_allocation_usd": full["calculated_allocation_usd"],
                  "monthly_spent_usd": full["monthly_spent_usd"],
                  "remaining_budget_usd": full["remaining_budget_usd"],
                  "final_purchase_usd": full["final_purchase_usd"],
                  "ledger_execution_count": full["ledger_execution_count"],
              }
          except Exception as exc:
              state.update({"status": "NO_ACTION_DATA_FAILURE", "failure_type": type(exc).__name__})
              material = {
                  "date_utc": today,
                  "status": "NO_ACTION_DATA_FAILURE",
                  "failure_type": type(exc).__name__,
              }

          canonical = json.dumps(material, sort_keys=True, separators=(",", ":"))
          fingerprint = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          state["fingerprint"] = fingerprint

          first_today = previous is None or previous.get("date_utc") != today
          changed = bool(previous and previous.get("date_utc") == today and previous.get("fingerprint") != fingerprint)
          notify = first_today or changed

          current_path = root / "current" / "state.json"
          current_path.write_text(json.dumps(state, sort_keys=True, indent=2) + "\n", encoding="utf-8")

          if notify:
              message_path = root / "current" / "message.txt"
              if state["status"] == "OK":
                  heading = "BTC DCA V1 — DAILY CHECK" if first_today else "BTC DCA V1 — INTRADAY UPDATE"
                  warning = (
                      "If you already bought BTC today, DO NOT buy again. Report the executed purchase so the canonical ledger can be updated."
                      if not first_today
                      else "Execution is manual. If you buy, report the actual amount and price before acting on a later intraday update."
                  )
                  message = "\n".join([
                      heading,
                      f"Observed: {observed}",
                      f"Market source: {state['market_source']} (Bybit Spot BTCUSDT)",
                      f"BTC price: USD {state['btc_price_usdt']}",
                      f"7D high: USD {state['rolling_7d_high_usdt']}",
                      f"Drawdown: {state['drawdown_percent']}%",
                      f"Fear & Greed: {state['fear_greed']}",
                      f"Base allocation: USD {state['base_allocation_usd']}",
                      f"Sentiment multiplier: x{state['sentiment_multiplier']}",
                      f"Calculated allocation: USD {state['calculated_allocation_usd']}",
                      f"Monthly spent: USD {state['monthly_spent_usd']}",
                      f"Remaining monthly budget: USD {state['remaining_budget_usd']}",
                      f"FINAL PURCHASE: USD {state['final_purchase_usd']}",
                      "",
                      warning,
                      "NO ORDER EXECUTED — MANUAL ACTION ONLY",
                      f"BUY USD {state['final_purchase_usd']} BTC TODAY",
                  ])
              else:
                  message = "\n".join([
                      "BTC DCA V1 — NO ACTION",
                      f"Observed: {observed}",
                      "Required fresh market/sentiment data could not be validated.",
                      f"Failure category: {state['failure_type']}",
                      "No allocation is issued while data are unavailable or invalid.",
                      "NO ORDER EXECUTED",
                  ])
              message_path.write_text(message + "\n", encoding="utf-8")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"notify={'true' if notify else 'false'}\n")
              handle.write(f"first_today={'true' if first_today else 'false'}\n")
              handle.write(f"changed={'true' if changed else 'false'}\n")
              handle.write(f"status={state['status']}\n")
              handle.write(f"fingerprint={fingerprint}\n")
          PY

      - name: Persist V1 monitor state
        uses: actions/upload-artifact@v6
        with:
          name: v1-recommendation-monitor-state
          path: ${{ env.V1_MONITOR_DIR }}/current/state.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Send Telegram V1 recommendation
        if: steps.evaluate.outputs.notify == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from btc_dca_bridge.config import load_notification_config
          from btc_dca_bridge.notifications import TelegramNotifier, TelegramTransport

          config = load_notification_config()
          token = os.environ[config.bot_token_env_var]
          chat_id = os.environ[config.chat_id_env_var]
          message = (Path(os.environ["V1_MONITOR_DIR"]) / "current" / "message.txt").read_text(encoding="utf-8").strip()
          TelegramNotifier(
              token,
              chat_id,
              transport=TelegramTransport(
                  connect_timeout_seconds=config.http.connect_timeout_seconds,
                  read_timeout_seconds=config.http.read_timeout_seconds,
                  max_attempts=config.http.retry_attempts,
                  backoff_seconds=config.http.backoff_seconds,
              ),
          ).send(message)
          PY

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## V1 recommendation monitor"
            echo
            echo "- Schedule: every 6 hours"
            echo "- Market policy: Bybit Spot BTCUSDT only; fail closed if unavailable"
            echo "- Execution: manual only"
            echo "- Order submission path: not used"
            echo "- Telegram notification: ${{ steps.evaluate.outputs.notify }}"
            echo "- First check today: ${{ steps.evaluate.outputs.first_today }}"
            echo "- Recommendation/state changed: ${{ steps.evaluate.outputs.changed }}"
            echo "- Status: ${{ steps.evaluate.outputs.status }}"
            echo "- Fingerprint: ${{ steps.evaluate.outputs.fingerprint }}"
          } >> "$GITHUB_STEP_SUMMARY"
