name: Update Bybit BTC Spot bridge

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate Bybit BTCUSDT Spot data
        id: collect
        continue-on-error: true
        run: python btc_dca_bridge/collect_bybit_spot.py

      - name: Commit latest snapshot even on collector failure
        if: always()
        run: |
          git config user.name "btc-dca-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add btc_dca_bridge/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Bybit BTC Spot snapshot"
          git push

      - name: Mark workflow failed if collector failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
