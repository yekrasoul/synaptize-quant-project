name: Update Bybit BTC Spot bridge

on:
  push:
    paths:
      - "btc_dca_bridge/collect_bybit_spot.py"
      - ".github/workflows/bybit-btc-spot-bridge.yml"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate Bybit BTCUSDT Spot data
        run: python btc_dca_bridge/collect_bybit_spot.py
      - name: Commit latest validated snapshot
        run: |
          git config user.name "btc-dca-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add btc_dca_bridge/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Bybit BTC Spot snapshot"
          git push
