name: Audit latest canonical shadow

on:
  push:
    branches:
      - ops/audit-shadow-20261009

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: btc_dca_bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Build audit run context
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run python -m btc_dca_bridge production-context             --trigger manual             --process-started-at "$NOW"             --trigger-created-at "$NOW"             --trigger-id "$GITHUB_RUN_ID"             --output /tmp/production-context.json
      - name: Run canonical production shadow
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m btc_dca_bridge production-shadow             --context /tmp/production-context.json             --result-json /tmp/production-result.json
          cat /tmp/production-result.json
