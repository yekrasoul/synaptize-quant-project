name: BTC DCA Branch Guardian Trusted

# This workflow is intentionally event-driven from the default branch. It
# never executes workflow content or result artifacts supplied by a feature
# branch; it checks out main and recomputes merge eligibility there.
on:
  workflow_run:
    workflows: ["BTC DCA Branch Guardian"]
    types: [completed]

permissions: {}

jobs:
  trusted-guardian:
    name: Branch Guardian / Safety classification
    if: >-
      github.event.workflow_run.name == 'BTC DCA Branch Guardian' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Check out trusted main implementation
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python and uv
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install trusted locked dependencies
        working-directory: btc_dca_bridge
        run: uv sync --frozen

      - name: Verify source workflow identity and branch policy
        shell: bash
        run: |
          set -euo pipefail
          case "$BRANCH" in
            feat/*|fix/*|refactor/*) ;;
            *) echo "unapproved source branch: $BRANCH" >&2; exit 1 ;;
          esac
          test "${{ github.event.workflow_run.conclusion }}" = success
          test "${{ github.event.workflow_run.name }}" = "BTC DCA Branch Guardian"

      - name: Fetch exact source branch and compute trusted diff
        shell: bash
        run: |
          set -euo pipefail

          # Full history is required for a trustworthy merge-base check.
          # Never introduce shallow fetches in this comparison path.
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"

          base_sha=$(git rev-parse "refs/remotes/origin/main^{commit}")
          source_ref="refs/remotes/origin/$BRANCH"
          source_tip=$(git rev-parse "$source_ref^{commit}")

          # The branch must still point at the exact commit validated by the
          # originating Branch Guardian run. Force-pushes fail closed.
          if [[ "$source_tip" != "$HEAD_SHA" ]]; then
            echo "source branch tip no longer matches validated HEAD_SHA" >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "$HEAD_SHA")" != "commit" ]]; then
            echo "validated HEAD_SHA is not a commit" >&2
            exit 1
          fi

          merge_base=$(git merge-base "$base_sha" "$HEAD_SHA") || {
            echo "no merge base between current main and validated source head" >&2
            exit 1
          }

          # Current main must be an ancestor of the exact validated head.
          # Behind or diverged branches fail closed.
          if [[ "$merge_base" != "$base_sha" ]]; then
            echo "source branch is behind or diverged from current main" >&2
            exit 1
          fi

          test "$(git rev-list --count "$base_sha..$HEAD_SHA")" -ge 1

          printf '%s\n' "$base_sha" > /tmp/guardian-base-sha
          git diff --name-only "$base_sha...$HEAD_SHA" > /tmp/guardian-files.txt
          git diff "$base_sha...$HEAD_SHA" > /tmp/guardian-diff.txt

      - name: Recompute Guardian classification from trusted main
        working-directory: btc_dca_bridge
        env:
          BOOTSTRAPPED: ${{ vars.BRANCH_GUARDIAN_BOOTSTRAPPED }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--branch "$BRANCH" --head-sha "$HEAD_SHA" --base-sha "$(cat /tmp/guardian-base-sha)" --changed-files /tmp/guardian-files.txt --diff /tmp/guardian-diff.txt --output /tmp/trusted-guardian-result.json)
          if [[ "$BOOTSTRAPPED" != "true" ]]; then args+=(--bootstrap); fi
          uv run python -m btc_dca_bridge branch-guardian-classify "${args[@]}"
          test "$(jq -r .classification /tmp/trusted-guardian-result.json)" != FAIL

      - name: Verify trusted runtime state and ledger immutability
        working-directory: btc_dca_bridge
        shell: bash
        run: |
          set -euo pipefail
          expected_ledger=c436b9dfa7c669ce2f463a155b3dc7aa6f10af35efe183bb61531999dd4ec920
          test "$(sha256sum ledger/executions.jsonl | awk '{print $1}')" = "$expected_ledger"
          uv run python -m btc_dca_bridge validate >/tmp/trusted-validate.json
          uv run python -m btc_dca_bridge live-authorization-status >/tmp/trusted-authorization.json
          uv run python -m btc_dca_bridge live-activation-status >/tmp/trusted-activation.json
          uv run python -m btc_dca_bridge production-enablement-status >/tmp/trusted-enablement.json
          set +e
          uv run python -m btc_dca_bridge final-readiness-audit >/tmp/trusted-readiness.json
          readiness_status=$?
          set -e
          test "$readiness_status" -eq 2
          jq -e '.["authorization"] == "NOT_AUTHORIZED" and .execution == "BLOCKED"' /tmp/trusted-readiness.json
          jq -e '.["authorization"] == "NOT_AUTHORIZED" and .execution == "BLOCKED"' /tmp/trusted-authorization.json
          jq -e '.["activation"] == "NOT_ACTIVATED" and .execution == "BLOCKED"' /tmp/trusted-activation.json
          jq -e '.["enablement"] == "NOT_ENABLED" and .execution == "BLOCKED"' /tmp/trusted-enablement.json
          jq -e '.checks.unresolved_submission_attempts.state == "HEALTHY" and .real_money_execution_possible == false' /tmp/trusted-readiness.json
          jq -e '.checks.execution_config.state == "HEALTHY" and .checks.execution_config.live_execution_enabled == false and .checks.execution_config.kill_switch == true and .checks.execution_config.order_submission == "not_implemented" and .checks.execution_config.monthly_cap_usd == "500" and .checks.execution_config.market == "Bybit Spot BTCUSDT"' /tmp/trusted-readiness.json
          test "$(sha256sum ledger/executions.jsonl | awk '{print $1}')" = "$expected_ledger"

      - name: Verify Canonical validation before PR creation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            checks=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100")
            if jq -e --arg sha "$HEAD_SHA" 'any(.check_runs[]; .name == "Canonical validation" and .conclusion == "success" and .head_sha == $sha and ((.app.slug // "") == "github-actions" or (.app.name // "") == "GitHub Actions"))' <<<"$checks" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "required Canonical validation check is missing, failed, or attached to the wrong SHA" >&2
          exit 1

      - name: Ensure exactly one PR exists for the source branch
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [[ -z "$pr_number" ]]; then
            title=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA" --jq '.commit.message' | head -n1)
            body="Branch Guardian trusted classification: $(jq -r .classification /tmp/trusted-guardian-result.json)\n\nNO ORDER EXECUTED"
            pr_number=$(gh pr create --repo "$REPOSITORY" --base main --head "$BRANCH" --title "$title" --body "$body" | sed -E 's#.*/##')
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Verify PR identity and required Canonical validation
        shell: bash
        run: |
          set -euo pipefail
          pr_number='${{ steps.pr.outputs.number }}'
          pr_json=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json baseRefName,headRefOid)
          test "$(jq -r .baseRefName <<<"$pr_json")" = main
          test "$(jq -r .headRefOid <<<"$pr_json")" = "$HEAD_SHA"
          compare=$(gh api "repos/$REPOSITORY/compare/main...$HEAD_SHA")
          test "$(jq -r .behind_by <<<"$compare")" = 0
          checks=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100")
          jq -e --arg sha "$HEAD_SHA" 'any(.check_runs[]; .name == "Canonical validation" and .conclusion == "success" and .head_sha == $sha and ((.app.slug // "") == "github-actions" or (.app.name // "") == "GitHub Actions"))' <<<"$checks"

      - name: Enable guarded auto-merge only after all trusted checks
        if: vars.BRANCH_GUARDIAN_BOOTSTRAPPED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .classification /tmp/trusted-guardian-result.json)" = SAFE_ENGINEERING
          test "$(jq -r .protected_files_unchanged /tmp/trusted-guardian-result.json)" = true
          test "$(jq -r .ledger_unchanged /tmp/trusted-guardian-result.json)" = true
          test "$(jq -r .execution_config_safe /tmp/trusted-guardian-result.json)" = true
          test "$(jq -r .runtime_blocked /tmp/trusted-guardian-result.json)" = true
          test "$(jq -r .authorization /tmp/trusted-guardian-result.json)" = NOT_AUTHORIZED
          test "$(jq -r .activation /tmp/trusted-guardian-result.json)" = NOT_ACTIVATED
          test "$(jq -r .production_enablement /tmp/trusted-guardian-result.json)" = NOT_ENABLED
          test "$(jq -r .execution /tmp/trusted-guardian-result.json)" = BLOCKED
          gh pr merge '${{ steps.pr.outputs.number }}' --repo "$REPOSITORY" --auto --merge

      - name: Trusted Guardian summary
        if: always()
        shell: bash
        run: |
          {
            echo '## BTC DCA BRANCH GUARDIAN — TRUSTED GATE'
            echo
            if [[ -f /tmp/trusted-guardian-result.json ]]; then cat /tmp/trusted-guardian-result.json; fi
            echo
            echo 'NO ORDER EXECUTED'
          } >> "$GITHUB_STEP_SUMMARY"
