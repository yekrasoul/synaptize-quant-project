name: Verify shadow provider import

on:
  push:
    branches:
      - fix/shadow-approved-provider-import

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: btc_dca_bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python -m compileall -q src tests
      - run: uv run python -m unittest tests.test_shadow.ShadowPipelineTest.test_live_shadow_builder_uses_approved_ordered_spot_provider -v
      - run: uv run python -m unittest discover -s tests -v
